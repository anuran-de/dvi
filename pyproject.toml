[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvi"
version = "0.1.0"
description = "Data Versioning Intelligence — semantic change detection and causal root-cause analysis for data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuran De" }]
keywords = ["data-observability", "data-lineage", "root-cause-analysis", "data-quality", "semantic-drift"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/anuran-de/dvi"
Repository = "https://github.com/anuran-de/dvi"
Documentation = "https://github.com/anuran-de/dvi/tree/main/docs"
Changelog = "https://github.com/anuran-de/dvi/blob/main/CHANGELOG.md"
Issues = "https://github.com/anuran-de/dvi/issues"
"Live demo" = "https://dvintelligence.vercel.app"

[project.scripts]
dvi = "dvi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dvi" = ["py.typed"]
"dvi.calibration" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
