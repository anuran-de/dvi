[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dvi"
version = "0.1.0"
description = "Data Versioning Intelligence — semantic change detection and causal root-cause analysis for data pipelines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anuran De" }]
keywords = ["data-observability", "data-lineage", "root-cause-analysis", "data-quality", "semantic-drift"]

dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "networkx>=3.2",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/anuran-de/dvi"
Repository = "https://github.com/anuran-de/dvi"

[project.scripts]
dvi = "dvi.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dvi.calibration" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
